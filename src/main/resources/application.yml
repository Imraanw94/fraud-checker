spring:
  application:
    name: fraud-check
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraudcheck}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  api:
    username: ${API_USERNAME:admin}
    password: ${API_PASSWORD:password}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.imraan.fraudcheck: ${LOG_LEVEL_APP:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

fraudrules:
  review-threshold: 40
  reject-threshold: 70
  rules:
    - code: HIGH_AMOUNT
      type: HIGH_AMOUNT
      risk-weight: 20
      values: [10000]
    - code: HIGH_RISK_COUNTRY
      type: HIGH_RISK_COUNTRY
      risk-weight: 50
      values: [IL, AE, US]
    - code: BLACKLISTED_MERCHANT
      type: BLACKLISTED_MERCHANT
      risk-weight: 70
      values: [ShadyMerchant, SusGuys]
    - code: SUPPORTED_CURRENCIES
      type: SUPPORTED_CURRENCIES
      risk-weight: 70
      values: [ZAR, EUR]
