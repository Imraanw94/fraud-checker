spring:
  application:
    name: fraud-check
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraudcheck}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

fraudrules:
  review-threshold: 40
  reject-threshold: 70
  rules:
    - code: HIGH_AMOUNT
      type: HIGH_AMOUNT
      risk-weight: 20
      values: [10000]
    - code: HIGH_RISK_COUNTRY
      type: HIGH_RISK_COUNTRY
      risk-weight: 50
      values: [IL, AE, US]
